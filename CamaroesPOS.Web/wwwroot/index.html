<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CAMAROES POS — Web Edition</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
</head>
<body>
    <div id="app">
        <div class="boot-screen">
            <div class="boot-card">
                <div class="boot-logo">
                    <span class="boot-badge">C</span>
                    <div>
                        <div class="boot-title">CAMAROES</div>
                        <div class="boot-sub">POS SYSTEM · .NET 8 BLAZOR</div>
                    </div>
                </div>
                <div class="boot-spinner"></div>
                <p class="boot-hint">Chargement de l'application C# WebAssembly...</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Une erreur inattendue est survenue.
        <a href="" class="reload">Recharger</a>
        <a class="dismiss">×</a>
    </div>

    <script src="js/posInterop.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
